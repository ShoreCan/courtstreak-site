<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CourtStreak</title>
  <script>
    var base = '/courtstreak-site';
    var path = window.location.pathname;

    if (path.indexOf(base) === 0) {
      var route = path.slice(base.length);

      sessionStorage.setItem(
        'courtstreakRedirect',
        route + window.location.search + window.location.hash
      );

      window.location.replace(base + '/');
    }
  </script>
</head>
<body></body>
</html>
