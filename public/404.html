<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CourtStreak</title>
  <script>
    var path = window.location.pathname;
    var base = '/courtstreak-site';

    if (path.indexOf(base) === 0) {
      var route = path.substring(base.length) || '/';
      sessionStorage.setItem(
        'courtstreakRedirect',
        route + window.location.search + window.location.hash
      );
      window.location.replace(base + '/');
    }
  </script>
</head>
<body></body>
</html>
