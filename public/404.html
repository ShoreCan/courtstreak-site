<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CourtStreak</title></head><body><p>Opening CourtStreak…</p><script>
(function () {
  var base = '/courtstreak-site';
  if (window.location.pathname.indexOf(base + '/') === 0) {
    sessionStorage.setItem('courtstreakRedirect', window.location.pathname.slice(base.length) + window.location.search + window.location.hash);
    window.location.replace(base + '/');
  }
})();
</script><noscript>Enable JavaScript to open CourtStreak.</noscript></body></html>
