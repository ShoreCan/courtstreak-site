<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CourtStreak setup layout preview</title><style>*{box-sizing:border-box}body{margin:0;background:hsl(216 63% 5%);color:hsl(220 90% 98%);font-family:Arial,sans-serif;padding:26px}h1{font-size:24px;letter-spacing:-.5px;margin:0 0 8px}p{font-size:13px;color:hsl(217 24% 70%);margin:0 0 20px}.phones{display:flex;gap:20px}.phone{width:var(--phone-width,390px);flex-shrink:0}h2{font-size:14px;font-weight:500;margin:0 0 10px;color:hsl(217 24% 70%)}iframe{display:block;width:var(--phone-width,390px);height:var(--phone-height,780px);border:1px solid #26364e;border-radius:18px;background:#091321}</style></head><body><h1>Camera setup • layout preview</h1><p>Recorded still with illustrative interface states. This is not a live tracking result.</p><div class="phones"><section class="phone"><h2>1. Place the phone</h2><iframe title="Place the phone" src="./camera-setup.html?phase=placing"></iframe></section><section class="phone"><h2>2. Confirm the view</h2><iframe title="Confirm the view" src="./camera-setup.html?phase=setup"></iframe></section><section class="phone"><h2>3. Count in</h2><iframe title="Count in" src="./camera-setup.html?phase=countdown"></iframe></section></div><script>
const sizes=new URLSearchParams(location.search),w=Number(sizes.get('w'))||390,h=Number(sizes.get('h'))||780;
document.documentElement.style.setProperty('--phone-width',w+'px');document.documentElement.style.setProperty('--phone-height',h+'px');
for(const frame of document.querySelectorAll('iframe')){const u=new URL(frame.src);if(w>h)u.searchParams.set('landscape','1');if(sizes.has('recorded'))u.searchParams.set('recorded','1');frame.src=u.href;}
if(!sizes.has('recorded'))document.querySelector('body>p').textContent='Illustrative interface states. This is not a live tracking result.';
</script></body></html>
